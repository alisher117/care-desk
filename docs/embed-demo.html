<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Embed demo</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 680px; margin: 80px auto; padding: 0 24px; color: #1f2937; line-height: 1.6; }
      button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>Some other website</h1>
    <p>This page is not part of Care Desk. The help button in the corner comes from one script tag.</p>
    <p><button type="button" onclick="CareDesk.open()">Contact support</button> opens the same widget from the page's own button.</p>
    <p style="margin-top: 1200px">The widget stays in the corner while the page scrolls.</p>

    <script src="http://localhost:3000/widget.js" data-locale="en" async></script>
  </body>
</html>
